name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make lint

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make deadcode

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make test

  build:
    runs-on: ubuntu-latest
    needs: [lint, deadcode, test]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libhivex-bin jq
      # Root is required for chroot during initramfs rebuild in phony-guest
      # linux e2e tests (unprivileged runners deny chroot/unshare).
      - name: Run e2e tests
        run: sudo --preserve-env=PATH,GOROOT,GOPATH,GOCACHE,GOMODCACHE make test-e2e
